<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms- tut 7</title>
</head>

<body>
    <h1>Your Data</h1>
    <DIV>
        <form action="post">
            <label for="username"> Enter your username: </label>
            <input type="text" name="username" id="username" placeholder="Enter your username" autofocus>
        </form>
    </DIV>

    <DIV>
        <input type="radio" id="male" name="gender" value="male" >
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female" >
        <label for="female">Female</label>
    </DIV>

    <div>
        <input type="checkbox" name="Subscribe" id="Subscribe" value="yes">
        <label for="Subscribe">Subscribe For Updates</label>
    </div>

    <label for="comment">please comment</label>
    <br>
    <textarea name="comment" rows="5" cols="50"></textarea>

    <div>
        <select name="something">
            <option value="code">code</option>
            <option value="run">run</option>
            <option value="jump">jump</option>
        </select>

    </div>

</body>

</html>
